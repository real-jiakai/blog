# 网站的基本url地址
baseURL: https://blog.gujiakai.top
# 网站使用的主题
# 通过 module.imports（而非 theme: 键）挂载主题，以便用 files 整体排除主题的
# static/js/：本站脚本是 assets/ts/ 里的 TypeScript（由 _partials/script-url.html
# 用 js.Build 编译），emaction 用的是本站 static/js/ 里的补丁版；若不排除，主题的
# 同名 JS 会在本站副本删除后「顶上来」被复制进 public/。注意：不能排除
# images/favicon.ico 和 css/style.css —— 站点没有自己的副本，正是从主题取用这两个文件。
# files 取反语法是「! 」（叹号后必须带空格）；只写取反模式时其余文件默认全部挂载。
# 写成 "!xxx"（无空格）会被当作普通 glob，结果是整个挂载点什么都不包含。
# 声明 mounts 会关闭主题的默认挂载，因此 i18n 必须显式挂载：主题模板（如标签页的
# 分页 partial）依赖主题 i18n 键，缺失时会静默渲染成空字符串。
module:
  imports:
    - path: hugo-theme-simple
      mounts:
        - source: layouts
          target: layouts
        - source: archetypes
          target: archetypes
        - source: i18n
          target: i18n
        - source: static
          target: static
          files:
            - "! js/**"
# 第三方服务
services:
  # google分析
  googleAnalytics:
    ID: "G-2N2G7YVYD1"
  # RSS 仅保留最新 20 篇（此前全量 ~80 篇全文，单个 feed 超 1MB）
  rss:
    limit: 20
# 永久链接
permalinks:
  blog: /:year/:month/:slug
# 分页器
pagination:
  pagerSize: 5
# 开启robots.txt
enableRobotsTXT: true
# 不生成内容前置数据声明的别名页；Hugo 固有的语言/分页别名由 layouts/alias.html 标记 noindex，
# 并在 Netlify 上通过 force 规则返回真正的 301。
disableAliases: true
# 只使用 tags 分类；不声明的话 Hugo 默认还会生成空的 categories
# 页面（/categories/ 与 /en/categories/）及其 RSS
taxonomies:
  tag: tags
# 标签页标题保留 front matter 的原始写法（本站标签全部小写：csdn、vps…）。
# Hugo 默认把自动生成的列表标题首字母大写，csdn 会变成 "Csdn"，与站内
# 其他位置（标签云、归档徽章、文章元信息）的小写展示不一致
capitalizeListTitles: false

# 输出格式配置
# - 为每篇文章额外生成 .md 原始文件（如 /2026/06/slug.md）
# - uglyURLs 全局开启，让 .md 生成为 slug.md 而非 slug/index.md；
#   HTML / RSS 通过 noUgly 保持原有 pretty URL（/slug/、/index.xml），不影响 SEO
uglyURLs: true
outputFormats:
  HTML:
    noUgly: true
  RSS:
    noUgly: true
  MarkdownRaw:
    mediaType: text/markdown
    isPlainText: true
    isHTML: false
  # 搜索索引：由 layouts/home.searchindex.json 按语言在构建时生成
  # （/search-index.json 与 /en/search-index.json）。VPS 上的 Meilisearch 直接
  # clone 本仓库、跑 hugo，再把这两个文件推进 blog_zh / blog_en —— 写入用的
  # admin key 因此始终留在那台机器上，不必进 GitHub Secrets。
  # 不需要 noUgly：uglyURLs 不影响 home kind 的输出路径（baseName 决定文件名）。
  # notAlternative 让它不进入 head.html 的 <link rel=alternate>。
  SearchIndex:
    baseName: search-index
    mediaType: application/json
    isPlainText: true
    isHTML: false
    notAlternative: true
  # llms.txt（https://llmstxt.org）：由 layouts/home.llms.txt 按语言在构建时生成
  # （/llms.txt 与 /en/llms.txt），取代过去手工维护、容易过期的 static/ 副本
  LLMS:
    baseName: llms
    mediaType: text/plain
    isPlainText: true
    isHTML: false

# RSS输出配置 - 为每种语言生成RSS
outputs:
  home:
    - HTML
    - RSS
    - LLMS
    # 对 zh/en 同时生效，无需 languages.*.outputs 覆盖（覆盖是整体替换而非合并）
    - SearchIndex
  section:
    - HTML
    - RSS
  # 仅博客文章生成 .md 原文（通过 content/*/blog/_index.md 的 cascade.outputs 开启）；
  # about / til 等普通页面保持仅 HTML，避免产生无引用的孤立 .md
  page:
    - HTML

# 多语言设置
# 中文为默认语言，保持根路径不变（不加/zh/前缀）
# 英文使用/en/前缀
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

# 语言配置
languages:
  zh:
    label: "中文"
    locale: "zh-CN"
    weight: 1
    title: "顾佳凯的网络日志"
    contentDir: "content/zh"
    # 中文内容按 CJK 规则统计字数/阅读时长（英文站点不需要）
    hasCJKLanguage: true
    params:
      description: "一个专注于分享技术和个人经历的博客"
      keywords: "博客,技术,个人,生活"
      author: "顾佳凯"
      footer: "&copy; 2022-{Year} Made with ❤️ By Jiakai"
    menu:
      main:
        - name: "主页"
          url: "/"
          weight: 1
        - name: "归档"
          url: "/archive/"
          weight: 2
        - name: "标签"
          url: "/tags/"
          weight: 3
        - name: "til"
          url: "/til/"
          weight: 4
        - name: "关于"
          url: "/about/"
          weight: 5
  en:
    label: "English"
    locale: "en-US"
    weight: 2
    title: "Jiakai's Blog"
    contentDir: "content/en"
    params:
      description: "A blog focusing on sharing tech and personal experiences"
      keywords: "blog,tech,personal,life"
      author: "Jiakai"
      footer: "&copy; 2022-{Year} Made with ❤️ By Jiakai"
    menu:
      main:
        - name: "Home"
          url: "/"
          weight: 1
        - name: "Archive"
          url: "/archive/"
          weight: 2
        - name: "Tags"
          url: "/tags/"
          weight: 3
        - name: "TIL"
          url: "/til/"
          weight: 4
        - name: "About"
          url: "/about/"
          weight: 5

# 全局参数（作为默认值）
params:
  description: "A blog focusing on sharing tech and personal experiences"
  keywords: "blog,tech,personal,life"
  author: "jiakai"
  footer: "&copy; 2022-{Year} Made with ❤️ By Jiakai"
  # 本地、分支部署和 Deploy Preview 默认为 false；Netlify 仅在 production context 覆盖为 true。
  enableAnalytics: false
  # 站内搜索：前端直接打自建 Meilisearch 的 REST API（不引 SDK）。
  # - endpoint 留空时 /search/ 显示「暂不可用」，构建与部署照常，不会报错；
  #   接好 VPS 后填上即可，无需改模板。
  # - apiKey 必须是只读的 search-only key（Meilisearch /keys 里 actions 仅
  #   ["search"]），它会出现在页面源码里，这是设计如此；绝不可填 master key。
  # - 索引名按语言拼成 blog_zh / blog_en，两个索引分开：81 篇中英是一一对应的
  #   译文，合并后任何命中共享词（docker、claude）的查询都会把同一篇返回两次。
  search:
    endpoint: "https://search.gujiakai.top"
    # search-only key（uid fa9c43f9…，actions ["search"]，仅限 blog_zh / blog_en）。
    # 出现在页面源码里是设计如此：已实测除这两个索引的搜索外，建索引 / 写文档 /
    # 删索引 / 列 key 全部 403。绝不可换成 master key，也不要用 Meilisearch
    # 自动生成的那个 `*` 范围的 "Default Search API Key"。
    apiKey: "752323ffef493b6d4bbf6b21fce2e62ffd62be19126bed5eeb95f11e42754e50"
    indexPrefix: "blog_"

# markup设置
markup:
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: false
    hl_inline: false
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    noClasses: false
    # noClasses:false 时渲染只产 class，配色由 static/css/syntax.css 决定
    # （站点级文件遮蔽主题同名文件）；此处 style 仅作意图记录，与
    # `hugo gen chromastyles --style=github-dark` 保持一致。
    style: github-dark
    tabWidth: 4
    wrapperClass: highlight
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: 'https'
      strikethrough: true
      table: true
      taskList: true
      typographer: true
    parser:
      autoHeadingID: true
      autoHeadingIDType: 'github'
      attribute:
        block: false
        title: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false
    tableOfContents:
        startLevel: 2
        endLevel: 3
        ordered: false
